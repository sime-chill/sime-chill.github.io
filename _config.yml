# Academic homepage configuration. Personal facts in this file are migrated
# from the previous Jekyll site; do not add biographical data without review.
title: "Yuhan He"
description: "Welcome to Yuhan's blog!"
url: "https://yhhe.top"
baseurl: ""
repository: "sime-chill/sime-chill.github.io"

google_analytics_id:
google_site_verification:
bing_site_verification:
baidu_site_verification:

author:
  name: "Yuhan He"
  avatar: "/assets/img/pic_hyh3.png"
  bio: "Ph.D. student at Fudan University (FDU)"
  location: "Shanghai, China"
  employer:
  googlescholar: "https://scholar.google.com/citations?user=O6HhhY8AAAAJ"
  email: "heyh25@m.fudan.edu.cn"
  github: "sime-chill"
  pubmed:
  researchgate:
  uri:
  linkedin:
  dblp:
  orcid:
  twitter:
  weibo:

include:
  - _pages

# Legacy theme samples and generated copies are kept in Git history but are
# not part of the published academic homepage.
exclude:
  - .sass-cache
  - .jekyll-cache
  - .siteflow-backup
  - .github
  - _site
  - CLAUDE.md
  - AGENTS.md
  - docs
  - etached
  - _posts
  - index.md
  - work.md
  - blog.md
  - CHANGELOG.md
  - LICENSE.md
  - README.md
  - screenshot.png
  - bay_jekyll_theme.gemspec
  - scripts
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor

keep_files:
  - .git

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-feed

whitelist:
  - jekyll-feed
